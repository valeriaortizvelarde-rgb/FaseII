<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente del Catálogo BUI</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 780px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #0f172a;
    color: #e2e8f0;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #94a3b8; margin-top: 0; }
  #chat {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    min-height: 300px;
    max-height: 55vh;
    overflow-y: auto;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 1rem;
    background: #1e293b;
    margin-bottom: 1rem;
  }
  .msg { padding: 0.6rem 0.9rem; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { background: #2563eb; align-self: flex-end; max-width: 85%; }
  .msg.bot { background: #334155; align-self: flex-start; max-width: 90%; }
  .msg.thinking { opacity: 0.7; font-style: italic; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
  .sources { font-size: 0.8rem; color: #94a3b8; margin-top: 0.4rem; }
  form { display: flex; gap: 0.5rem; }
  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 1rem;
  }
  button {
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #apiKeyRow { display: none; gap: 0.5rem; margin-bottom: 0.75rem; }
  #apiKeyRow input { flex: 1; }
</style>
</head>
<body>
  <h1>Asistente del Catálogo BUI</h1>
  <p class="subtitle">Consulta las tablas del catálogo BUI que guarden similitud con el contexto que compartas en tu pregunta.</p>

  <div id="chat"></div>

  <form id="chatForm">
    <input type="text" id="message" placeholder="Escribe tu pregunta..." autocomplete="off" required />
    <button type="submit" id="sendBtn">Enviar</button>
  </form>

  <script>
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, role, sources) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement("div");
        s.className = "sources";
        s.textContent = "Posibles tablas: " + sources.map(s => s.table_name).filter(Boolean).slice(0, 5).join(", ");
        div.appendChild(s);
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;

      const thinkingEl = addMessage("Pensando…", "bot");
      thinkingEl.classList.add("thinking");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        thinkingEl.remove();

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addMessage("Error: " + (err.detail || res.statusText), "bot");
          return;
        }

        const data = await res.json();
        addMessage(data.answer, "bot", data.sources);
      } catch (err) {
        thinkingEl.remove();
        addMessage("Error de conexión: " + err.message, "bot");
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
